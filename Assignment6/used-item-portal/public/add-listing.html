<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sell Your Vehicle - AutoMart</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <div class="container header-inner">
      <a href="/" class="logo">AutoMart</a>
      <nav>
        <a href="/">Browse</a>
        <a href="/add-listing.html" class="active btn-primary">+ Sell Your Vehicle</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="form-page">
      <h2>Create a New Listing</h2>
      <p class="form-subtitle">Fill in the details about your vehicle to get started.</p>

      <div id="formMessage" class="form-message hidden"></div>

      <form id="addListingForm" class="listing-form">
        <div class="form-grid">
          <div class="form-group full-width">
            <label for="title">Title *</label>
            <input type="text" id="title" name="title" placeholder="e.g. 2019 Honda City VX" required />
          </div>

          <div class="form-group">
            <label for="category">Category *</label>
            <select id="category" name="category" required>
              <option value="">Select Category</option>
              <option value="car">Car</option>
              <option value="bike">Bike</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="brand">Brand</label>
            <input type="text" id="brand" name="brand" placeholder="e.g. Honda, Yamaha" />
          </div>

          <div class="form-group">
            <label for="year">Year</label>
            <input type="number" id="year" name="year" placeholder="e.g. 2019" min="1900" max="2026" />
          </div>

          <div class="form-group">
            <label for="price">Price (₹) *</label>
            <input type="number" id="price" name="price" placeholder="e.g. 450000" min="0" required />
          </div>

          <div class="form-group">
            <label for="kmDriven">KM Driven</label>
            <input type="number" id="kmDriven" name="kmDriven" placeholder="e.g. 35000" min="0" />
          </div>

          <div class="form-group">
            <label for="condition">Condition *</label>
            <select id="condition" name="condition" required>
              <option value="excellent">Excellent</option>
              <option value="good" selected>Good</option>
              <option value="fair">Fair</option>
              <option value="poor">Poor</option>
            </select>
          </div>

          <div class="form-group">
            <label for="fuelType">Fuel Type</label>
            <select id="fuelType" name="fuelType">
              <option value="">Select Fuel Type</option>
              <option value="petrol">Petrol</option>
              <option value="diesel">Diesel</option>
              <option value="electric">Electric</option>
              <option value="hybrid">Hybrid</option>
              <option value="cng">CNG</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" placeholder="e.g. Mumbai, Maharashtra" />
          </div>

          <div class="form-group">
            <label for="imageUrl">Image URL</label>
            <input type="text" id="imageUrl" name="imageUrl" placeholder="https://..." />
          </div>

          <div class="form-group">
            <label for="sellerName">Your Name *</label>
            <input type="text" id="sellerName" name="sellerName" placeholder="Full name" required />
          </div>

          <div class="form-group">
            <label for="sellerContact">Contact (Phone/Email) *</label>
            <input type="text" id="sellerContact" name="sellerContact" placeholder="Phone or email" required />
          </div>

          <div class="form-group full-width">
            <label for="description">Description *</label>
            <textarea id="description" name="description" rows="4" placeholder="Describe the vehicle - features, history, reason for selling..." required></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary btn-lg">Post Listing</button>
          <a href="/" class="btn-secondary btn-lg">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 AutoMart. Buy &amp; Sell Used Vehicles.</p>
    </div>
  </footer>

  <script src="/js/add-listing.js"></script>
</body>
</html>
