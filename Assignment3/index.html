<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foodie — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
      :root{ --orange:#ff6a00; --orange-dark:#e55b00; --muted:#6c757d }
      html,body{height:100%}
      body{display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fff6ef 0%, #fff 60%);font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial}
      .card-login{max-width:980px;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.08)}
      .brand{background:linear-gradient(135deg,var(--orange),var(--orange-dark));color:#fff;padding:48px 36px}
      .brand h1{font-size:1.6rem;margin-bottom:.25rem}
      .brand p{opacity:.95;margin-bottom:0}
      .form-panel{padding:36px}
      .form-control:focus{box-shadow:0 0 0 .15rem rgba(255,106,0,.15);border-color:var(--orange)}
      .btn-orange{background:var(--orange);border:none}
      .btn-orange:hover{background:var(--orange-dark)}
      .divider{height:1px;background:#f0f0f0;margin:18px 0}
      .social-btn{border:1px solid #eee}
      @media(max-width:767px){body{padding:24px}.brand{padding:28px;text-align:center}}
    </style>
  </head>
  <body>
    <div class="card card-login d-flex flex-row w-100">
      <div class="brand d-none d-md-flex flex-column justify-content-center col-md-5">
        <h1>Foodie</h1>
        <p>Your favourite meals — delivered fast.</p>
        <small class="mt-3">Sign in to manage orders, favorites and delivery addresses.</small>
      </div>

      <div class="form-panel col-12 col-md-7">
        <div class="container">
          <div class="row">
            <div class="col-12 mb-3 d-md-none text-center">
              <h2 style="color:var(--orange)">Foodie</h2>
              <p class="text-muted">Sign in to continue</p>
            </div>

            <div class="col-12">
              <form id="loginForm" novalidate>
                <div id="alertPlaceholder"></div>

                <div class="mb-3">
                  <label for="identifier" class="form-label">Email or Phone</label>
                  <input type="text" id="identifier" class="form-control" placeholder="your.example.com or +91 9xxxxxxxxx" required>
                  <div class="invalid-feedback">Please enter a valid email or phone number.</div>
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input type="password" id="password" class="form-control" placeholder="Enter password" required minlength="6">
                  <div class="invalid-feedback">Password must be at least 6 characters.</div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                  </div>
                  <a href="#" class="text-decoration-none">Forgot password?</a>
                </div>

                <div class="d-grid mb-3">
                  <button id="submitBtn" type="submit" class="btn btn-orange btn-lg">Sign in</button>
                </div>

                <div class="text-center text-muted mb-2">Or continue with</div>
                <div class="d-flex gap-2 mb-2">
                  <button type="button" class="btn btn-light w-100 social-btn"><i class="bi bi-google me-2"></i>Google</button>
                  <button type="button" class="btn btn-light w-100 social-btn"><i class="bi bi-facebook me-2"></i>Facebook</button>
                </div>

                <div class="divider"></div>
                <div class="text-center">Don't have an account? <a href="#">Create one</a></div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
